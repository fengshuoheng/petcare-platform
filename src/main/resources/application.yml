server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: petcare-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:petcare}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    # 不写默认值：真实密码请通过环境变量 DB_PASSWORD 或本地的 application-local.yml 提供（该文件不入库）
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    # 同理：Redis 若开了 requirepass，密码走 REDIS_PASSWORD 或 application-local.yml
    password: ${REDIS_PASSWORD:}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

knife4j:
  enable: true
  setting:
    language: zh_cn

petcare:
  store:
    name: 毛孩到家（文三路店）
    lat: 30.276000
    lng: 120.135000
    free-km: 5
    per-km-fee: 5
  auth:
    token-ttl-minutes: 120
    sms-ttl-minutes: 5
    # 验证码由服务端用 UUID 随机生成后写入 Redis，不在配置文件里写死
    sms-interval-seconds: 60
  order:
    pay-timeout-minutes: 15
    dispatch-timeout-minutes: 5
    auto-confirm-hours: 24
    reschedule-limit: 1
  settlement:
    commission-rate: 0.15
    settle-days: 7
  pay:
    # 模拟支付网关签名密钥；真实接入时放密钥管理系统
    secret: ${PAY_SECRET:petcare-mock-secret}
  ai:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    max-concurrency: 4
    # Python LangChain Agent 服务；关闭或调用失败时自动降级为本地规则 RAG
    enabled: ${AI_SERVICE_ENABLED:false}
    service-url: ${AI_SERVICE_URL:http://localhost:8000}
    internal-token: ${INTERNAL_TOKEN:petcare-internal-token}
    service-connect-timeout-ms: 2000
    service-read-timeout-ms: 15000

logging:
  level:
    com.haust.petcare: info
    com.haust.petcare.mapper: info
