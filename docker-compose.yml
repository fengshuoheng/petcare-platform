version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: petcare-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-petcare123456}
      MYSQL_DATABASE: petcare
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-petcare123456}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: petcare-redis
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: petcare-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: petcare
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-petcare123456}
      REDIS_HOST: redis
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_SERVICE_ENABLED: "true"
      AI_SERVICE_URL: http://ai-service:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-petcare-internal-token}
    ports:
      - "8082:8082"

  ai-service:
    build: ./ai-service
    container_name: petcare-ai
    depends_on:
      - app
    environment:
      JAVA_BASE_URL: http://app:8082
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-petcare-internal-token}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    ports:
      - "8000:8000"

  web:
    image: nginx:1.25-alpine
    container_name: petcare-web
    depends_on:
      - app
    ports:
      - "8090:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql-data:
